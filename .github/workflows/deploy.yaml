name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HEAD: ${{ github.ref_name }}
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINATOKEN: ${{ secrets.TINATOKEN }}
      TINASEARCH: ${{ secrets.TINASEARCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - name: Validate Tina env (presence only)
        run: |
          node -e "console.log('TINA_CLIENT_ID set:', !!process.env.TINA_CLIENT_ID)"
          node -e "console.log('TINATOKEN set:', !!process.env.TINATOKEN)"
          node -e "console.log('TINASEARCH set:', !!process.env.TINASEARCH)"
          node -e "console.log('HEAD branch:', process.env.HEAD || '(unset)')"
          test -n "${TINA_CLIENT_ID}" || (echo "ERROR: TINA_CLIENT_ID is empty in this job" && exit 1)
          test -n "${TINATOKEN}" || (echo "ERROR: TINATOKEN is empty in this job" && exit 1)
          test -n "${TINASEARCH}" || (echo "ERROR: TINASEARCH is empty in this job" && exit 1)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
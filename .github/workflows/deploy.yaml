name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: Validate Tina env (no values)
        env:
          TINACLIENTID: ${{ secrets.TINACLIENTID }}
          TINATOKEN: ${{ secrets.TINATOKEN }}
          TINASEARCH: ${{ secrets.TINASEARCH }}
        run: |
          node -e "console.log('TINACLIENTID set:', !!process.env.TINACLIENTID)"
          node -e "console.log('TINATOKEN set:', !!process.env.TINATOKEN)"
          test -n "${TINACLIENTID}" || (echo "ERROR: TINACLIENTID is empty in this job" && exit 1)
          test -n "${TINATOKEN}" || (echo "ERROR: TINATOKEN is empty in this job" && exit 1)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4